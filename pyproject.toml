[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "smart-intent"
version = "0.1.0"
description = "Task context and evidence-backed read-only tools for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "pydantic>=2.11,<3", "tzdata>=2025.1"]

[project.scripts]
smart-intent = "smart_intent.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/smart_intent"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs/*.md", "/config/smart-intent.example.toml", "/integrations", "/examples", "/SKILL.md", "/README.md", "/pyproject.toml", "/uv.lock"]
